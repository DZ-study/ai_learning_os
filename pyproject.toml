[project]
name = "server"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.2",
    "alembic>=1.18.5",
    "asyncpg>=0.31.0",
    "authlib>=1.7.2",
    "black>=26.5.1",
    "fastapi[standard]>=0.139.2",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "redis>=8.0.1",
    "ruff>=0.16.1",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.51.0",
]

[tool.alembic]
script_location = "alembic"

[tool.ruff.lint.per-file-ignores]
"**/router.py" = ["B008"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I"
]

[tool.black]
line-length = 100
